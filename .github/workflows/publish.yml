name: publish

on:
  release:
    types: [published]

# permissions are needed if pushing to ghcr.io
permissions:
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - name: Check out
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
    - name: Install dependencies
      run: pip install -r requirements.txt
    - name: Validate Python compilation
      run: python -m compileall -q .
    - name: Type check application modules
      run: |
        python -m pip install mypy
        mypy --ignore-missing-imports --disable-error-code=import-untyped --follow-imports=skip main.py prediction_selector.py prediction_saver.py confidence_evaluator.py prediction.py label.py detector_factory.py yolov9_postprocess.py
    - name: Run unit tests
      run: python -m unittest discover -s tests -v
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Login to GHCR
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
    - name: Build and push
      id: docker_build
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
